<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRHACKATHON</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b101b;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: linear-gradient(135deg, #e10098 0%, #2546f0 100%);
      color: white;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .site-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-transform: uppercase;
    }
    .status-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .blank-state {
      text-align: center;
      max-width: 480px;
    }
    .blank-title {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    .blank-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge">RR</div>
      <span class="site-title">RRHACKATHON</span>
    </div>
    <div class="status-tag">
      <span class="status-dot"></span>
      Online
    </div>
  </header>
  <main>
    <div class="blank-state">
      <h1 class="blank-title">RRHACKATHON</h1>
      <p class="blank-desc">Dashboard initialized. Blank page ready for data visualizations and analytics modules.</p>
    </div>
  </main>
</body>
</html>
